syntax = "proto3";

// option java_multiple_files = true;
// option java_package = "io.grpc.examples.routeguide";
// option java_outer_classname = "RouteGuideProto";
// option objc_class_prefix = "RTG";

package communication;

// Interface exported by the server.
service Communication_Server {

  rpc _send_and_display_image(Array_message) returns (Empty) {}

  rpc _display_points(Empty) returns (Empty) {}

  rpc _display_dark(Empty) returns (Empty) {}
  
}

message Array_message {
    string datatype = 1;
    int32 width = 2;
    int32 height = 3;
    bytes bytesarray = 4;
}

message Empty {
}




